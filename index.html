<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="생산기술팀 업무일지"><title>업무일지 v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e6e9ee;padding:14px 18px 10px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:#7b8491;margin-top:3px}.datebar{display:flex;align-items:center;gap:7px;margin-top:12px}.datebar button{border:1px solid #dfe4eb;background:#fff;border-radius:9px;padding:7px 11px}.datebar input{border:1px solid #dfe4eb;border-radius:9px;padding:7px 9px}.date-label{flex:1;text-align:center;font-weight:800}.tabs{display:flex;gap:7px;padding:12px 16px 4px;overflow:auto}.tab{border:0;background:#f0f3f7;color:#5d6674;border-radius:18px;padding:8px 14px;white-space:nowrap}.tab.active{background:#1677ff;color:#fff;font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px}.stat{border:1px solid #e5e9ef;border-radius:11px;padding:9px 11px}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:#7d8692}.week{margin:5px 16px 14px;border:1px solid #e4e8ee;border-radius:12px;display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}.day{border:0;border-right:1px solid #e8ebef;background:#fff;padding:8px 3px;text-align:center}.day:last-child{border-right:0}.day small{display:block;color:#8a93a0}.day strong{display:block;margin-top:3px}.day.today{background:#eef6ff}.day.selected{box-shadow:inset 0 -3px 0 #1677ff}.day b{display:inline-block;margin-top:4px;min-width:18px;padding:1px 4px;border-radius:9px;background:#1677ff;color:#fff;font-size:10px}.section-title{font-weight:800;font-size:15px;margin:10px 16px 8px}.list{padding:0 16px 100px}.empty{padding:42px 10px;text-align:center;color:#8b94a1}.card{border:1px solid #e1e6ec;border-radius:13px;padding:13px 14px;margin-bottom:9px}.card-head{display:flex;justify-content:space-between;gap:10px}.card-title{font-weight:800}.badge{font-size:11px;border-radius:12px;padding:4px 8px;background:#edf1f5;color:#626d7c;white-space:nowrap}.badge.done{background:#e8f7ee;color:#18854f}.badge.progress{background:#fff3dc;color:#a56400}.meta{font-size:12px;color:#7a8390;margin-top:6px}.detail{font-size:14px;line-height:1.55;margin-top:8px;white-space:pre-wrap}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;border:1px solid #dfe4eb;background:#fff;border-radius:8px;padding:7px}.actions .danger{color:#d33;border-color:#f1cccc}.fab{position:fixed;right:max(18px,calc((100vw - 1120px)/2 + 18px));bottom:76px;width:52px;height:52px;border:0;border-radius:50%;background:#1677ff;color:#fff;font-size:28px;box-shadow:0 5px 15px #0002}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;max-width:1120px;margin:auto;height:58px;background:#fff;border-top:1px solid #e5e9ee;display:flex}.bottom button{flex:1;border:0;background:#fff;color:#7b8491}.bottom button.active{color:#1677ff;font-weight:800}.dialog{border:0;border-radius:16px;width:min(680px,94vw);padding:0;box-shadow:0 15px 50px #0003}.dialog::backdrop{background:#0006}.form{padding:20px}.form h2{margin:0 0 15px}.form label{display:block;font-size:13px;font-weight:800;margin:11px 0 5px}.form input,.form select,.form textarea{width:100%;border:1px solid #dfe4eb;border-radius:9px;padding:9px;background:#fff}.form textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-actions{display:flex;gap:8px;margin-top:18px}.form-actions button{flex:1;border:1px solid #dfe4eb;background:#fff;border-radius:9px;padding:10px}.form-actions .save{background:#1677ff;border-color:#1677ff;color:#fff}.form-actions .del{color:#c62828}.hint{font-size:11px;color:#89929e;margin-top:4px}.report{display:none;padding:16px 16px 90px}.report-head{display:flex;justify-content:space-between;gap:10px;align-items:end}.report h2{margin:4px 0 3px}.report-period{font-size:12px;color:#7b8491}.report-actions{display:flex;gap:7px;margin:13px 0}.report-actions button{border:1px solid #dfe4eb;background:#fff;border-radius:9px;padding:8px 11px}.report-actions .primary{background:#1677ff;color:#fff;border-color:#1677ff}.report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.rstat{border:1px solid #e3e7ed;border-radius:10px;padding:8px}.rstat b{font-size:17px;display:block}.rstat span{font-size:11px;color:#7b8491}.report-table{width:100%;border-collapse:collapse;font-size:13px}.report-table th,.report-table td{border:1px solid #dfe4eb;padding:8px;vertical-align:top;text-align:left}.report-table th{background:#f2f4f7}.report-table .daycol{width:82px}.report-table .catcol{width:105px}.week-group{margin:14px 0 8px;font-weight:800}.setting-note{font-size:12px;color:#727b88;background:#f7f8fa;border:1px solid #e7eaee;border-radius:10px;padding:9px;margin-bottom:12px}
@media(max-width:650px){.row,.summary,.report-summary{grid-template-columns:1fr 1fr}.week{font-size:11px}.day{padding:7px 1px}.report-table{font-size:12px}.report-table .catcol{width:85px}}
@media print{.top,.tabs,.summary,.week,.fab,.bottom,.report-actions,.setting-note{display:none!important}.report{display:block!important;padding:0}.app{max-width:none}.report-table{font-size:11px}}
</style></head>
<body><div class="app">
<header class="top"><div class="title">업무일지</div><div class="sub">생산기술팀 · 일일 업무관리 / 주간업무보고</div>
<div class="datebar"><button id="prev">‹</button><input id="datePick" type="date"><div class="date-label" id="dateLabel"></div><button id="next">›</button></div></header>
<main id="main">
<div class="tabs"><button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="todo">예정</button><button class="tab" data-filter="progress">진행 중</button><button class="tab" data-filter="done">완료</button></div>
<div class="summary"><div class="stat"><b id="cntAll">0</b><span>전체</span></div><div class="stat"><b id="cntTodo">0</b><span>예정</span></div><div class="stat"><b id="cntProgress">0</b><span>진행 중</span></div><div class="stat"><b id="cntDone">0</b><span>완료</span></div></div>
<div class="week" id="week"></div><div class="section-title">오늘 업무</div><div class="list" id="list"></div></main>
<section class="report" id="report"><div class="report-head"><div><h2>주간업무보고</h2><div class="report-period" id="reportPeriod"></div></div></div>
<div class="report-actions"><button class="primary" id="csvBtn">엑셀 저장</button><button id="printBtn">인쇄</button></div>
<div class="setting-note">※ 매일 입력한 업무를 주간 단위로 자동 정리합니다. 업무명은 짧게, 세부내용에는 실시 내용·결과·조치사항을 입력하는 방식으로 구성했습니다.</div>
<div class="report-summary"><div class="rstat"><b id="rAll">0</b><span>전체 업무</span></div><div class="rstat"><b id="rDone">0</b><span>완료</span></div><div class="rstat"><b id="rProg">0</b><span>진행 중</span></div><div class="rstat"><b id="rTodo">0</b><span>예정</span></div></div>
<table class="report-table"><thead><tr><th class="daycol">일자</th><th class="catcol">업무구분</th><th>담당업무 / 주요내용</th><th>진행상태</th></tr></thead><tbody id="reportBody"></tbody></table></section>
<button class="fab" id="addBtn">＋</button>
<nav class="bottom"><button class="active" data-page="daily">일일업무</button><button data-page="weekly">주간업무</button></nav></div>
<dialog class="dialog" id="dlg"><form class="form" id="form"><h2 id="dlgTitle">업무 등록</h2><input type="hidden" id="editId">
<label>업무일자</label><input id="fDate" type="date" required>
<div class="row"><div><label>업무구분</label><select id="fCat"><option>공정 표준화</option><option>설비 안전</option><option>생산성 개선</option><option>신제품 대응</option><option>품질</option><option>기타</option></select></div>
<div><label>진행상태</label><select id="fStatus"><option value="progress">진행 중</option><option value="todo">예정</option><option value="done">완료</option></select></div></div>
<label>담당업무</label><input id="fTitle" required placeholder="예: 작업지도서 개정"><div class="hint">주간보고에 표시될 짧은 업무명으로 입력하세요.</div>
<label>주요내용 / 실시내용</label><textarea id="fDetail" placeholder="예: 생산계획 일정 대비 미등록 작업지도서 개정"></textarea>
<label>결과 / 조치사항</label><textarea id="fResult" placeholder="예: 현장 확인 후 개정본 반영 및 작업자 배포"></textarea>
<label>비고</label><input id="fMemo" placeholder="필요 시 입력">
<div class="form-actions"><button type="button" id="cancel">취소</button><button type="button" class="del" id="delete">삭제</button><button class="save" id="saveBtn">저장</button></div></form></dialog>
<script>
const KEY='worklog_v2';let items=JSON.parse(localStorage.getItem(KEY)||'[]');let selected=new Date();let filter='all';let page='daily';
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=s=>{let d=new Date(s+'T00:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`};
const weekStart=d=>{let x=new Date(d),day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));x.setHours(0,0,0,0);return x};
const statusName=s=>s==='done'?'완료':s==='progress'?'진행 중':'예정';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function render(){ $('datePick').value=iso(selected);$('dateLabel').textContent=fmt(iso(selected));renderTabs();renderWeek();renderList();renderReport()}
function renderTabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));let a=items.filter(x=>x.date===iso(selected));$('cntAll').textContent=a.length;$('cntTodo').textContent=a.filter(x=>x.status==='todo').length;$('cntProgress').textContent=a.filter(x=>x.status==='progress').length;$('cntDone').textContent=a.filter(x=>x.status==='done').length}
function renderWeek(){let s=weekStart(selected),h='';for(let i=0;i<7;i++){let d=new Date(s);d.setDate(s.getDate()+i);let k=iso(d),n=items.filter(x=>x.date===k).length;h+=`<button class="day ${k===iso(new Date())?'today ':''}${k===iso(selected)?'selected ':''}" data-day="${k}"><small>${['월','화','수','목','금','토','일'][i]}</small><strong>${d.getDate()}</strong>${n?`<b>${n}</b>`:''}</button>`}$('week').innerHTML=h;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.day+'T00:00:00');render()})}
function renderList(){let day=iso(selected),a=items.filter(x=>x.date===day&&(filter==='all'||x.status===filter)).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt));if(!a.length){$('list').innerHTML='<div class="empty">등록된 업무가 없습니다.<br>오른쪽 아래 ＋ 버튼으로 업무를 등록하세요.</div>';return}
$('list').innerHTML=a.map(x=>`<article class="card"><div class="card-head"><div><div class="card-title">${esc(x.title)}</div><div class="meta">${esc(x.category)}</div></div><span class="badge ${x.status}">${statusName(x.status)}</span></div>${x.detail?`<div class="detail">${esc(x.detail)}</div>`:''}${x.result?`<div class="detail"><b>결과/조치:</b> ${esc(x.result)}</div>`:''}${x.memo?`<div class="meta">비고: ${esc(x.memo)}</div>`:''}<div class="actions"><button data-edit="${x.id}">수정</button>${x.status!=='done'?`<button data-done="${x.id}">완료 처리</button>`:''}<button class="danger" data-del="${x.id}">삭제</button></div></article>`).join('');
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let x=items.find(x=>x.id===b.dataset.done);x.status='done';x.updatedAt=Date.now();save();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('이 업무를 삭제할까요?')){items=items.filter(x=>x.id!==b.dataset.del);save();render()}})}
function renderReport(){let s=weekStart(selected),e=new Date(s);e.setDate(e.getDate()+6);$('reportPeriod').textContent=`${fmt(iso(s))} ~ ${fmt(iso(e))}`;let a=items.filter(x=>x.date>=iso(s)&&x.date<=iso(e)).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));$('rAll').textContent=a.length;$('rDone').textContent=a.filter(x=>x.status==='done').length;$('rProg').textContent=a.filter(x=>x.status==='progress').length;$('rTodo').textContent=a.filter(x=>x.status==='todo').length;
if(!a.length){$('reportBody').innerHTML='<tr><td colspan="4" style="text-align:center">해당 주의 업무가 없습니다.</td></tr>';return}
$('reportBody').innerHTML=a.map(x=>`<tr><td>${x.date}<br>${new Date(x.date+'T00:00:00').toLocaleDateString('ko-KR',{weekday:'short'})}</td><td>${esc(x.category)}</td><td><b>${esc(x.title)}</b>${x.detail?`<br>${esc(x.detail)}`:''}${x.result?`<br><span style="color:#5d6674">결과/조치: ${esc(x.result)}</span>`:''}${x.memo?`<br><span style="color:#7b8491">비고: ${esc(x.memo)}</span>`:''}</td><td>${statusName(x.status)}</td></tr>`).join('')}
function openNew(){$('dlgTitle').textContent='업무 등록';$('editId').value='';$('fDate').value=iso(selected);$('fCat').value='공정 표준화';$('fStatus').value='progress';$('fTitle').value='';$('fDetail').value='';$('fResult').value='';$('fMemo').value='';$('delete').style.display='none';$('dlg').showModal();setTimeout(()=>$('fTitle').focus(),50)}
function openEdit(id){let x=items.find(x=>x.id===id);if(!x)return;$('dlgTitle').textContent='업무 수정';$('editId').value=id;$('fDate').value=x.date;$('fCat').value=x.category;$('fStatus').value=x.status;$('fTitle').value=x.title;$('fDetail').value=x.detail||'';$('fResult').value=x.result||'';$('fMemo').value=x.memo||'';$('delete').style.display='block';$('dlg').showModal()}
$('saveBtn').onclick=()=>{let title=$('fTitle').value.trim();if(!title){alert('담당업무를 입력하세요.');return}let id=$('editId').value||crypto.randomUUID(),obj={id,date:$('fDate').value,category:$('fCat').value,status:$('fStatus').value,title,detail:$('fDetail').value.trim(),result:$('fResult').value.trim(),memo:$('fMemo').value.trim(),updatedAt:Date.now()};if($('editId').value){let i=items.findIndex(x=>x.id===id);items[i]=obj}else{obj.createdAt=Date.now();items.push(obj)}save();selected=new Date(obj.date+'T00:00:00');$('dlg').close();render()};
$('cancel').onclick=()=>$('dlg').close();$('delete').onclick=()=>{let id=$('editId').value;if(id&&confirm('이 업무를 삭제할까요?')){items=items.filter(x=>x.id!==id);save();$('dlg').close();render()}};
$('addBtn').onclick=openNew;$('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()};$('next').onclick=()=>{selected.setDate(selected.getDate()+1);render()};$('datePick').onchange=e=>{selected=new Date(e.target.value+'T00:00:00');render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x===b));$('main').style.display=page==='daily'?'block':'none';$('report').style.display=page==='weekly'?'block':'none';$('addBtn').style.display=page==='daily'?'block':'none';if(page==='weekly')renderReport()});
$('csvBtn').onclick=()=>{let s=weekStart(selected),e=new Date(s);e.setDate(e.getDate()+6);let a=items.filter(x=>x.date>=iso(s)&&x.date<=iso(e)).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));let rows=[['일자','업무구분','담당업무','주요내용/실시내용','결과/조치사항','진행상태','비고'],...a.map(x=>[x.date,x.category,x.title,x.detail,x.result,statusName(x.status),x.memo])];let csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),aEl=document.createElement('a');aEl.href=url;aEl.download=`주간업무보고_${iso(s)}_${iso(e)}.csv`;aEl.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('printBtn').onclick=()=>window.print();render();
</script></body></html>
