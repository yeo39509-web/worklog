<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="description" content="생산기술팀 업무일지"><title>업무일지 v2.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e6e9ee;padding:14px 18px 10px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:#7b8491;margin-top:3px}.datebar{display:flex;align-items:center;gap:7px;margin-top:12px}.datebar button{border:1px solid #dfe4eb;background:#fff;border-radius:9px;padding:7px 11px}.datebar input{border:1px solid #dfe4eb;border-radius:9px;padding:7px 9px}.date-label{flex:1;text-align:center;font-weight:800}.quickbar{display:flex;gap:7px;margin-top:10px}.quickbar input{flex:1;border:1px solid #dfe4eb;border-radius:9px;padding:9px 10px;background:#fff}.quickbar button{border:0;background:#1677ff;color:#fff;border-radius:9px;padding:8px 13px;font-weight:700}.calendar-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 5px}.calendar-head strong{font-size:15px}.calendar-head button{border:1px solid #dfe4eb;background:#fff;border-radius:8px;padding:5px 9px}.month-cal{margin:0 16px 14px;border:1px solid #e4e8ee;border-radius:12px;overflow:hidden}.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-weekdays div{padding:7px 2px;text-align:center;font-size:11px;font-weight:700;color:#7b8491;background:#f7f8fa;border-right:1px solid #e8ebef}.cal-weekdays div:last-child{border-right:0}.cal-cell{min-height:42px;border:0;border-right:1px solid #e8ebef;border-top:1px solid #e8ebef;background:#fff;text-align:center;padding:5px 2px;color:#394352}.cal-cell:nth-child(7n){border-right:0}.cal-cell.other{color:#b1b7c0;background:#fafbfc}.cal-cell.today{background:#eef6ff}.cal-cell.selected{box-shadow:inset 0 -3px 0 #1677ff}.cal-cell .num{display:block;font-size:11px;font-weight:700}.cal-cell .count{display:inline-block;margin-top:2px;min-width:18px;padding:1px 4px;border-radius:9px;background:#1677ff;color:#fff;font-size:10px}.cal-cell.sun .num{color:#e05b5b}.cal-cell.sat .num{color:#4277c9}.tabs{display:flex;gap:7px;padding:10px 16px 8px;overflow:auto}.tab{border:1px solid #dfe4eb;background:#f0f3f7;color:#5d6674;border-radius:18px;padding:7px 13px;white-space:nowrap;font-size:12px;font-weight:700}.tab.active{background:#1677ff;border-color:#1677ff;color:#fff;font-weight:800}.week{margin:5px 16px 14px;border:1px solid #e4e8ee;border-radius:12px;display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}.day{border:0;border-right:1px solid #e8ebef;background:#fff;padding:8px 3px;text-align:center}.day:last-child{border-right:0}.day small{display:block;color:#8a93a0}.day strong{display:block;margin-top:3px}.day.today{background:#eef6ff}.day.selected{box-shadow:inset 0 -3px 0 #1677ff}.day b{display:inline-block;margin-top:4px;min-width:18px;padding:1px 4px;border-radius:9px;background:#1677ff;color:#fff;font-size:10px}.section-title{font-weight:800;font-size:15px;margin:10px 16px 8px}.list{padding:0 16px 100px}.empty{padding:42px 10px;text-align:center;color:#8b94a1}.card{border:1px solid #e1e6ec;border-radius:13px;padding:13px 14px;margin-bottom:9px}.card.overdue{border:2px solid #e53935}.card-head{display:flex;justify-content:space-between;gap:10px}.card-title{font-weight:800}.badge{font-size:11px;border-radius:12px;padding:4px 8px;background:#edf1f5;color:#626d7c;white-space:nowrap}.badge.done{background:#e8f7ee;color:#18854f}.badge.progress{background:#fff3dc;color:#a56400}.meta{font-size:12px;color:#7a8390;margin-top:6px}.detail{font-size:14px;line-height:1.55;margin-top:8px;white-space:pre-wrap}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;border:1px solid #dfe4eb;background:#fff;border-radius:8px;padding:7px}.actions .danger{color:#d33;border-color:#f1cccc}.fab{position:fixed;right:max(18px,calc((100vw - 1120px)/2 + 18px));bottom:76px;width:52px;height:52px;border:0;border-radius:50%;background:#1677ff;color:#fff;font-size:28px;box-shadow:0 5px 15px #0002}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;max-width:1120px;margin:auto;height:58px;background:#fff;border-top:1px solid #e5e9ee;display:flex}.bottom button{flex:1;border:0;background:#fff;color:#7b8491}.bottom button.active{color:#1677ff;font-weight:800}.dialog{border:0;border-radius:16px;width:min(680px,94vw);padding:0;box-shadow:0 15px 50px #0003}.dialog::backdrop{background:#0006}.form{padding:20px}.form h2{margin:0 0 15px}.form label{display:block;font-size:13px;font-weight:800;margin:11px 0 5px}.form input,.form select,.form textarea{width:100%;border:1px solid #dfe4eb;border-radius:9px;padding:9px;background:#fff}.form textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-actions{display:flex;gap:8px;margin-top:18px}.form-actions button{flex:1;border:1px solid #dfe4eb;background:#fff;border-radius:9px;padding:10px}.form-actions .save{background:#1677ff;border-color:#1677ff;color:#fff}.form-actions .del{color:#c62828}.hint{font-size:11px;color:#89929e;margin-top:4px}.report{display:none;padding:16px 16px 90px}.report-head{display:flex;justify-content:space-between;gap:10px;align-items:end}.report h2{margin:4px 0 3px}.report-period{font-size:12px;color:#7b8491}.report-actions{display:flex;gap:7px;margin:13px 0}.report-actions button{border:1px solid #dfe4eb;background:#fff;border-radius:9px;padding:8px 11px}.report-actions .primary{background:#1677ff;color:#fff;border-color:#1677ff}.report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.rstat{border:1px solid #e3e7ed;border-radius:10px;padding:8px}.rstat b{font-size:17px;display:block}.rstat span{font-size:11px;color:#7b8491}.report-table{width:100%;border-collapse:collapse;font-size:13px}.report-table th,.report-table td{border:1px solid #dfe4eb;padding:8px;vertical-align:top;text-align:left}.report-table th{background:#f2f4f7}.report-table .daycol{width:82px}.report-table .catcol{width:110px}.report-table .workcol{width:180px}.report-table td{line-height:1.5}.report-table .cat-group{font-weight:800;text-align:center;background:#f7f8fa}.report-table .work-title{font-weight:800}.report-table .subtext{margin-top:4px}.week-group{margin:14px 0 8px;font-weight:800}.setting-note{font-size:12px;color:#727b88;background:#f7f8fa;border:1px solid #e7eaee;border-radius:10px;padding:9px;margin-bottom:12px}
@media(max-width:650px){.row,.summary,.report-summary{grid-template-columns:1fr 1fr}.week{font-size:11px}.day{padding:7px 1px}.report-table{font-size:12px}.report-table .catcol{width:78px}.report-table .workcol{width:120px}.report-actions{flex-wrap:wrap}.report-actions button{flex:1;min-width:90px}}
@media print{.top,.tabs,.week,.fab,.bottom,.report-actions,.setting-note{display:none!important}.report{display:block!important;padding:0}.app{max-width:none}.report-table{font-size:11px}}
</style></head>
<body><div class="app">
<header class="top"><div class="title">업무일지</div><div class="sub">생산기술팀 · 일일 업무관리 / 주간업무보고</div>
<div class="datebar"><button id="prev">‹</button><input id="datePick" type="date"><div class="date-label" id="dateLabel"></div><button id="next">›</button></div><div class="quickbar"><input id="quickTitle" placeholder="업무를 입력하세요... (Enter)" autocomplete="off"><button id="quickAdd">등록</button></div></header>
<main id="main">
<div class="tabs"><button class="tab active" data-filter="all">전체 <span class="tab-count">0</span></button><button class="tab" data-filter="todo">예정 <span class="tab-count">0</span></button><button class="tab" data-filter="progress">진행 중 <span class="tab-count">0</span></button><button class="tab" data-filter="done">완료 <span class="tab-count">0</span></button></div>
<div class="calendar-head"><button id="calPrev">‹</button><strong id="calTitle"></strong><div style="display:flex;gap:5px"><button id="calToday">오늘</button><button id="calNext">›</button></div></div><div class="month-cal"><div class="cal-weekdays"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div><div class="cal-grid" id="calendar"></div></div><div class="section-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span id="daySectionTitle">선택일 업무</span><button id="dailyCsvBtn" style="border:1px solid #dfe4eb;background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700">엑셀 저장</button></div><div class="list" id="list"></div></main>
<section class="report" id="report"><div class="report-head"><div><h2>주간업무보고</h2><div class="report-period" id="reportPeriod"></div></div></div>
<div class="report-actions"><button id="prevWeekBtn">‹ 이전 주</button><button id="thisWeekBtn">이번 주</button><button id="nextWeekBtn">다음 주 ›</button><button class="primary" id="csvBtn">엑셀 저장</button><button id="printBtn">인쇄</button></div>
<div class="setting-note">※ 회사 주간업무보고 형식에 맞춰 <b>대분류 / 담당업무 / 금주실적 / 차주계획</b>으로 정리합니다. 일일업무에서 입력한 내용이 자동으로 반영됩니다.</div>
<div class="report-summary"><div class="rstat"><b id="rAll">0</b><span>전체 업무</span></div><div class="rstat"><b id="rDone">0</b><span>완료</span></div><div class="rstat"><b id="rProg">0</b><span>진행 중</span></div><div class="rstat"><b id="rTodo">0</b><span>예정</span></div></div>
<table class="report-table"><thead><tr><th class="catcol">대분류</th><th class="workcol">담당업무</th><th>금주실적</th><th>차주계획</th></tr></thead><tbody id="reportBody"></tbody></table></section>
<button class="fab" id="addBtn">＋</button>
<nav class="bottom"><button class="active" data-page="daily">일일업무</button><button data-page="weekly">주간업무</button></nav></div>
<dialog class="dialog" id="dlg"><form class="form" id="form"><h2 id="dlgTitle">업무 등록</h2><input type="hidden" id="editId">
<label>업무일자</label><input id="fDate" type="date" required>
<div class="row"><div><label>업무구분</label><select id="fCat"><option>공정 표준화</option><option>설비 안전</option><option>생산성 개선</option><option>신제품 대응</option><option>품질</option><option>기타</option></select></div>
<div><label>진행상태</label><select id="fStatus"><option value="progress">진행 중</option><option value="todo">예정</option><option value="done">완료</option></select></div></div>
<label>담당업무</label><input id="fTitle" required placeholder="예: 작업지도서 개정"><div class="hint">주간보고에 표시될 짧은 업무명으로 입력하세요.</div>
<label>주요내용 / 실시내용</label><textarea id="fDetail" placeholder="예: 생산계획 일정 대비 미등록 작업지도서 개정"></textarea>
<label>결과 / 조치사항</label><textarea id="fResult" placeholder="예: 현장 확인 후 개정본 반영 및 작업자 배포"></textarea>
<label>차주계획</label><textarea id="fPlan" placeholder="예: 관련 모델 작업지도서 추가 개정 및 현장 적용 확인"></textarea>
<label>비고</label><input id="fMemo" placeholder="필요 시 입력">
<div class="form-actions"><button type="button" id="cancel">취소</button><button type="button" class="del" id="delete">삭제</button><button class="save" id="saveBtn">저장</button></div></form></dialog>
<script>
const KEY='worklog_v2';let items=JSON.parse(localStorage.getItem(KEY)||'[]');let selected=new Date();let filter='all';let page='daily';
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=s=>{let d=new Date(s+'T00:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`};
const weekStart=d=>{let x=new Date(d),day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));x.setHours(0,0,0,0);return x};
const statusName=s=>s==='done'?'완료':s==='progress'?'진행 중':'예정';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function render(){ $('datePick').value=iso(selected);$('dateLabel').textContent=fmt(iso(selected));$('daySectionTitle').textContent=filter==='today'?`${selected.getMonth()+1}월 ${selected.getDate()}일 업무`:filter==='progress'?'진행 중 업무':filter==='done'?'완료 업무':'전체 업무';renderTabs();renderCalendar();renderList();renderReport()}
function renderTabs(){let a=items.filter(x=>x.date===iso(selected));let counts={all:a.length,todo:a.filter(x=>x.status==='todo').length,progress:a.filter(x=>x.status==='progress').length,done:a.filter(x=>x.status==='done').length};document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.querySelector('.tab-count').textContent=counts[b.dataset.filter]})}
function renderCalendar(){
 let y=selected.getFullYear(),m=selected.getMonth();
 $('calTitle').textContent=`${y}년 ${m+1}월`;
 let first=new Date(y,m,1), startDay=(first.getDay()+6)%7;
 let days=new Date(y,m+1,0).getDate();
 let prevDays=new Date(y,m,0).getDate(),h='';
 for(let i=0;i<42;i++){
   let dayNum=i-startDay+1, d=new Date(y,m,dayNum), k=iso(d), other=d.getMonth()!==m;
   let n=items.filter(x=>x.date===k).length;
   let cls=`cal-cell ${other?'other ':''}${k===iso(new Date())?'today ':''}${k===iso(selected)?'selected ':''}${d.getDay()===0?'sun ':''}${d.getDay()===6?'sat ':''}`;
   h+=`<button class="${cls}" data-day="${k}"><span class="num">${d.getDate()}</span>${n?`<span class="count">${n}</span>`:''}</button>`;
 }
 $('calendar').innerHTML=h;
 document.querySelectorAll('.cal-cell').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.day+'T00:00:00');render()});
}
function renderList(){let day=iso(selected);let a;if(filter==='today'){a=items.filter(x=>x.date===day&&x.status!=='done')}else if(filter==='progress'){a=items.filter(x=>x.status==='progress')}else if(filter==='done'){a=items.filter(x=>x.status==='done')}else{a=[...items]}a.sort((a,b)=>{let ad=a.date+(a.time||''),bd=b.date+(b.time||'');return filter==='done'||filter==='progress' ? (bd.localeCompare(ad)||(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)) : bd.localeCompare(ad)});if(!a.length){$('list').innerHTML='<div class="empty">등록된 업무가 없습니다.<br>오른쪽 아래 ＋ 버튼으로 업무를 등록하세요.</div>';return}
$('list').innerHTML=a.map(x=>{let overdue=x.date<iso(new Date())&&x.status!=='done';return `<article class="card${overdue?' overdue':''}"><div class="card-head"><div><div class="card-title">${esc(x.title)}</div><div class="meta">${esc(x.category)}</div></div><span class="badge ${x.status}">${statusName(x.status)}</span></div>${x.detail?`<div class="detail">${esc(x.detail)}</div>`:''}${x.result?`<div class="detail"><b>결과/조치:</b> ${esc(x.result)}</div>`:''}${x.memo?`<div class="meta">비고: ${esc(x.memo)}</div>`:''}<div class="actions"><button data-edit="${x.id}">수정</button>${x.status!=='done'?`<button data-done="${x.id}">완료 처리</button>`:''}<button class="danger" data-del="${x.id}">삭제</button></div></article>`}).join('');
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let x=items.find(x=>x.id===b.dataset.done);x.status='done';x.updatedAt=Date.now();save();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('이 업무를 삭제할까요?')){items=items.filter(x=>x.id!==b.dataset.del);save();render()}})}
function renderReport(){
 let s=weekStart(selected),e=new Date(s);e.setDate(e.getDate()+6);
 $('reportPeriod').textContent=`${fmt(iso(s))} ~ ${fmt(iso(e))}`;
 let a=items.filter(x=>x.date>=iso(s)&&x.date<=iso(e)).sort((a,b)=>a.category.localeCompare(b.category,'ko')||a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
 $('rAll').textContent=a.length;$('rDone').textContent=a.filter(x=>x.status==='done').length;$('rProg').textContent=a.filter(x=>x.status==='progress').length;$('rTodo').textContent=a.filter(x=>x.status==='todo').length;
 if(!a.length){$('reportBody').innerHTML='<tr><td colspan="4" style="text-align:center;padding:28px">해당 주의 업무가 없습니다.</td></tr>';return}
 let groups=[];a.forEach(x=>{let g=groups.find(g=>g.name===x.category);if(!g){g={name:x.category,rows:[]};groups.push(g)}g.rows.push(x)});
 $('reportBody').innerHTML=groups.map(g=>g.rows.map((x,i)=>`<tr>${i===0?`<td class="cat-group" rowspan="${g.rows.length}">${esc(g.name)}</td>`:''}<td><div class="work-title">${esc(x.title)}</div><div class="subtext">${x.date.slice(5).replace('-','/')}</div></td><td>${x.detail?`<div>${esc(x.detail)}</div>`:''}${x.result?`<div class="subtext"><b>결과/조치:</b> ${esc(x.result)}</div>`:''}${!x.detail&&!x.result?'<span style="color:#9aa2ad">-</span>':''}</td><td>${x.nextPlan?esc(x.nextPlan):'<span style="color:#9aa2ad">-</span>'}</td></tr>`).join('')).join('');
}
function openNew(){$('dlgTitle').textContent='업무 등록';$('editId').value='';$('fDate').value=iso(selected);$('fCat').value='공정 표준화';$('fStatus').value='progress';$('fTitle').value='';$('fDetail').value='';$('fResult').value='';$('fPlan').value='';$('fMemo').value='';$('delete').style.display='none';$('dlg').showModal();setTimeout(()=>$('fTitle').focus(),50)}
function openEdit(id){let x=items.find(x=>x.id===id);if(!x)return;$('dlgTitle').textContent='업무 수정';$('editId').value=id;$('fDate').value=x.date;$('fCat').value=x.category;$('fStatus').value=x.status;$('fTitle').value=x.title;$('fDetail').value=x.detail||'';$('fResult').value=x.result||'';$('fPlan').value=x.nextPlan||'';$('fMemo').value=x.memo||'';$('delete').style.display='block';$('dlg').showModal()}
$('saveBtn').onclick=()=>{let title=$('fTitle').value.trim();if(!title){alert('담당업무를 입력하세요.');return}let id=$('editId').value||crypto.randomUUID(),obj={id,date:$('fDate').value,category:$('fCat').value,status:$('fStatus').value,title,detail:$('fDetail').value.trim(),result:$('fResult').value.trim(),nextPlan:$('fPlan').value.trim(),memo:$('fMemo').value.trim(),updatedAt:Date.now()};if($('editId').value){let i=items.findIndex(x=>x.id===id);items[i]=obj}else{obj.createdAt=Date.now();items.push(obj)}save();selected=new Date(obj.date+'T00:00:00');$('dlg').close();render()};
$('cancel').onclick=()=>$('dlg').close();$('delete').onclick=()=>{let id=$('editId').value;if(id&&confirm('이 업무를 삭제할까요?')){items=items.filter(x=>x.id!==id);save();$('dlg').close();render()}};
$('addBtn').onclick=openNew;
$('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()};
$('next').onclick=()=>{selected.setDate(selected.getDate()+1);render()};
$('datePick').onchange=e=>{selected=new Date(e.target.value+'T00:00:00');render()};
$('calPrev').onclick=()=>{selected=new Date(selected.getFullYear(),selected.getMonth()-1,1);render()};
$('calNext').onclick=()=>{selected=new Date(selected.getFullYear(),selected.getMonth()+1,1);render()};
$('calToday').onclick=()=>{selected=new Date();render()};
function quickCreate(){let title=$('quickTitle').value.trim();if(!title)return;let id=crypto.randomUUID(),obj={id,date:iso(selected),category:'공정 표준화',status:'progress',title,detail:'',result:'',nextPlan:'',memo:'',createdAt:Date.now(),updatedAt:Date.now()};items.push(obj);save();$('quickTitle').value='';render();openEdit(id)}
$('quickAdd').onclick=quickCreate;
$('quickTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();quickCreate()}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('.bottom button').forEach(x=>x.classList.toggle('active',x===b));$('main').style.display=page==='daily'?'block':'none';$('report').style.display=page==='weekly'?'block':'none';$('addBtn').style.display=page==='daily'?'block':'none';if(page==='weekly')renderReport()});
$('prevWeekBtn').onclick=()=>{selected=new Date(weekStart(selected));selected.setDate(selected.getDate()-7);render();renderReport()};
$('nextWeekBtn').onclick=()=>{selected=new Date(weekStart(selected));selected.setDate(selected.getDate()+7);render();renderReport()};
$('thisWeekBtn').onclick=()=>{selected=new Date();render();renderReport()};
function csvEscape(v){return `\"${String(v??'').replace(/\"/g,'\"\"')}\"`}
$('dailyCsvBtn').onclick=()=>{
 let day=iso(selected);
 let a=items.filter(x=>x.date===day).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 let rows=[['업무일자','대분류','진행상태','담당업무','주요내용 / 실시내용','결과 / 조치사항','차주계획','비고'],...a.map(x=>[x.date,x.category,statusName(x.status),x.title,x.detail||'',x.result||'',x.nextPlan||'',x.memo||''])];
 let csv='\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\n');
 let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),aEl=document.createElement('a');aEl.href=url;aEl.download=`일일업무_${day}.csv`;aEl.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('csvBtn').onclick=()=>{
 let s=weekStart(selected),e=new Date(s);e.setDate(e.getDate()+6);
 let a=items.filter(x=>x.date>=iso(s)&&x.date<=iso(e)).sort((a,b)=>a.category.localeCompare(b.category,'ko')||a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
 let rows=[['대분류','담당업무','금주실적','차주계획'],...a.map(x=>[x.category,x.title,[x.detail,x.result?`결과/조치: ${x.result}`:''].filter(Boolean).join('\n'),x.nextPlan||''])];
 let csv='\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\n');
 let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),aEl=document.createElement('a');aEl.href=url;aEl.download=`주간업무보고_${iso(s)}_${iso(e)}.csv`;aEl.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
};
$('printBtn').onclick=()=>window.print();render();
</script></body></html>
